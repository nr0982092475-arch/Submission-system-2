<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งงาน - ห้องเรียนครูปังปอนด์</title>
    <!-- Tailwind CSS สำหรับจัดรูปแบบหน้าตา -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 สำหรับแจ้งเตือนสวยๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- ฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0fdf4; } 
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="glass-panel w-full max-w-2xl p-6 md:p-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-600 mb-2">🚀 ระบบส่งงาน V2</h1>
            <p class="text-gray-600">ห้องเรียนครูปังปอนด์</p>
        </div>

        <form id="submissionForm" class="space-y-5" autocomplete="off">
            <!-- ข้อมูลส่วนตัว -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล</label>
                    <input type="text" id="fullname" required placeholder="ด.ช. / ด.ญ." autocomplete="off"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ระดับชั้นและห้อง</label>
                    <select id="classroom" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                        <option value="" disabled selected>เลือกชั้นเรียน</option>
                        <option value="ป.1/1">ประถมศึกษาปีที่ 1/1</option>
                        <option value="ป.1/2">ประถมศึกษาปีที่ 1/2</option>
                        <option value="ป.2/1">ประถมศึกษาปีที่ 2/1</option>
                        <option value="ป.2/2">ประถมศึกษาปีที่ 2/2</option>
                        <option value="ป.3/1">ประถมศึกษาปีที่ 3/1</option>
                        <option value="ป.3/2">ประถมศึกษาปีที่ 3/2</option>
                        <option value="ป.4/1">ประถมศึกษาปีที่ 4/1</option>
                        <option value="ป.4/2">ประถมศึกษาปีที่ 4/2</option>
                        <option value="ป.5/1">ประถมศึกษาปีที่ 5/1</option>
                        <option value="ป.5/2">ประถมศึกษาปีที่ 5/2</option>
                        <option value="ป.6/1">ประถมศึกษาปีที่ 6/1</option>
                        <option value="ป.6/2">ประถมศึกษาปีที่ 6/2</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เลขที่</label>
                    <input type="number" id="number" required placeholder="เช่น 1, 2, 3" autocomplete="off"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วิชา</label>
                    <select id="subject" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                        <option value="" disabled selected>⏳ กำลังโหลดวิชา...</option>
                    </select>
                </div>
            </div>

            <!-- ข้อมูลงาน -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่องาน / บทเรียน</label>
                <input type="text" id="workName" required placeholder="เช่น ใบงาน Scratch, ออกแบบป้าย" autocomplete="off"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์ผลงาน (ถ้ามี เช่น ลิงก์ Scratch, Canva)</label>
                <input type="url" id="workLink" placeholder="https://..." autocomplete="off"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">แนบไฟล์ผลงาน (ภาพ, เอกสาร)</label>
                <input type="file" id="file" multiple accept="image/*,.pdf,.doc,.docx"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer">
                <p class="text-xs text-gray-500 mt-1">* สามารถเลือกใส่ลิงก์ หรือแนบไฟล์ อย่างใดอย่างหนึ่ง หรือทั้งสองอย่างได้</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความเพิ่มเติมถึงคุณครู (ถ้ามี)</label>
                <textarea id="message" rows="2" placeholder="อธิบายเพิ่มเติม หรือแจ้งปัญหาการส่งงาน"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-md">
                📤 ส่งงานให้คุณครู
            </button>
        </form>
    </div>

    <script>
        // ⚠️ Web App URL เดิม
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTfdTYnXTS3ZkhCzUCFmdrf3b3vFZCBBqSXwrXeP8WAnioBTIy0gKHv9hTwQEaCtlfaA/exec';

        // โค้ดส่วนดึงวิชาจาก Google Sheets เมื่อเปิดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', async () => {
            const subjectSelect = document.getElementById('subject');
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getSubjects', { redirect: 'follow' });
                const result = await response.json();
                
                if (result.status === 'success' && result.data.length > 0) {
                    subjectSelect.innerHTML = '<option value="" disabled selected>เลือกวิชา</option>';
                    result.data.forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub;
                        opt.textContent = sub;
                        subjectSelect.appendChild(opt);
                    });
                } else {
                    subjectSelect.innerHTML = '<option value="" disabled selected>ไม่พบข้อมูลวิชา</option>';
                }
            } catch(e) {
                // เผื่ออินเทอร์เน็ตมีปัญหา จะแสดง 2 วิชานี้เป็นค่าเริ่มต้น
                subjectSelect.innerHTML = '<option value="" disabled selected>เลือกวิชา</option>';
                ['วิทยาการคำนวณ', 'การงานอาชีพ', 'อื่นๆ'].forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub;
                    opt.textContent = sub;
                    subjectSelect.appendChild(opt);
                });
            }
        });

        // โค้ดส่งงานเหมือนเดิม
        document.getElementById('submissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('file');
            const workLink = document.getElementById('workLink').value;

            if (fileInput.files.length === 0 && !workLink) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ยังไม่พบผลงาน',
                    text: 'กรุณาแนบไฟล์ หรือ ใส่ลิงก์ผลงาน อย่างใดอย่างหนึ่งครับ',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'กำลังอัปโหลด... ⏳';

            Swal.fire({
                title: 'กำลังส่งงาน...',
                text: 'กรุณารอสักครู่ ระบบกำลังจัดเก็บผลงานของคุณ',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                fullname: document.getElementById('fullname').value,
                classroom: document.getElementById('classroom').value,
                number: document.getElementById('number').value,
                subject: document.getElementById('subject').value,
                workName: document.getElementById('workName').value,
                workLink: workLink,
                message: document.getElementById('message').value,
                files: []
            };

            const toBase64 = file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = error => reject(error);
            });

            try {
                if (fileInput.files.length > 0) {
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const base64Data = await toBase64(fileInput.files[i]);
                        payload.files.push({
                            name: fileInput.files[i].name,
                            mimeType: fileInput.files[i].type,
                            data: base64Data
                        });
                    }
                }

                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'ส่งงานสำเร็จ! 🎉',
                        text: 'คุณครูได้รับผลงานของคุณเรียบร้อยแล้ว',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#16a34a'
                    });
                    document.getElementById('submissionForm').reset();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถส่งงานได้ กรุณาลองใหม่อีกครั้ง หรือติดต่อคุณครู',
                    confirmButtonText: 'ปิด',
                    confirmButtonColor: '#dc2626'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '📤 ส่งงานให้คุณครู';
            }
        });
    </script>
</body>
</html>
